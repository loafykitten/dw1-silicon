[package]
name = "dw1"
description = "Digimon World as a native Apple Silicon app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
backend = { version = "0.1.0", path = "../backend" }
decomp-c = { path = "../decomp-c" }
pack = { path = "../pack" }
png = "0.17"
psyq = { path = "../psyq" }
render = { path = "../render" }
sha1_smol = "1"
sdl3 = { version = "0.20.0", default-features = false, features = ["build-from-source-static", "raw-window-handle"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSWindow", "NSGraphics", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKFrameInfo", "WKNavigation", "WKPreferences"] }
serde_json = "1"
